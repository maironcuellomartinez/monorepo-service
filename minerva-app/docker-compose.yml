version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: minerva-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: minerva_db
    ports:
      - "3307:3306"
    volumes:
      - minerva_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  minerva_mysql_data:
