# Apache forward-proxy — egress de api-snowq-service hacia ServiceNow
#
# api-snowq-service no tiene salida directa a internet en staging/prod.
# Para llegar a la instancia real de ServiceNow (BASE_URL_SERVICENOW y, si
# SN_AUTH_MODE=oauth2, también SN_OAUTH_URL), sale por este Apache actuando
# como forward proxy (CONNECT tunneling), no como reverse proxy — es un rol
# DISTINTO al de apache-staging.conf (ese recibe tráfico DE afuera hacia
# adentro; este deja salir tráfico DE adentro hacia afuera).
#
# Por eso va en un <VirtualHost>/Listen separado — mezclar ProxyRequests On
# (forward) con el vhost reverse-proxy de apache-staging.conf es un error
# común que puede convertir ese vhost en un proxy abierto para cualquiera
# que le pegue por internet.
#
# api-snowq-service usa esto via SN_PROXY_URL (.env.staging/.env.production)
# → HttpsProxyAgent en src/servicenow/client/sn-proxy-agent.ts, aplicado
# tanto al HttpModule global (ServiceNowClientService) como a la llamada
# OAuth2 directa (servicenow-token.service.ts).
#
# Requiere:
#   sudo a2enmod proxy proxy_connect
#   sudo systemctl reload apache2

Listen 8080

<VirtualHost *:8080>
    # Sin ServerName — este vhost no responde a un dominio público, solo
    # acepta conexiones desde la red interna donde vive api-snowq-service.

    ProxyRequests On
    ProxyVia On

    # CONNECT (túnel HTTPS) solo al puerto 443 — no dejar abrir túneles a
    # cualquier puerto arbitrario.
    AllowCONNECT 443

    <Proxy *>
        # Restringido a la IP interna de api-snowq-service — NUNCA dejar
        # esto abierto (Require all granted convertiría esto en un proxy
        # abierto de internet, uno de los abusos más comunes de mod_proxy
        # mal configurado).
        Require ip 127.0.0.1
        # Sumar acá la IP real de api-snowq-service si corre en otra máquina.
    </Proxy>

    # mod_proxy no tiene un mecanismo simple para restringir el DESTINO de
    # un túnel CONNECT (el contenido es opaco, va cifrado TLS de punta a
    # punta) — la restricción por destino (solo la instancia real de
    # ServiceNow) tiene que hacerse a nivel de firewall/red, no acá.

    ErrorLog  ${APACHE_LOG_DIR}/forward-proxy-error.log
    CustomLog ${APACHE_LOG_DIR}/forward-proxy-access.log combined
</VirtualHost>
