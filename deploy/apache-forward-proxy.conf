# Apache forward-proxy — egress de api-snowq-service e integration-service
#
# Ninguno de los dos tiene salida directa a internet en staging/prod:
#   - api-snowq-service → ServiceNow real (BASE_URL_SERVICENOW, y si
#     SN_AUTH_MODE=oauth2 también SN_OAUTH_URL)
#   - integration-service → Minerva SOAP, DropPoint, Outlook/MS Graph
#
# Salen por este Apache actuando como forward proxy (CONNECT tunneling), no
# como reverse proxy — es un rol DISTINTO al de apache-staging.conf (ese
# recibe tráfico DE afuera hacia adentro; este deja salir tráfico DE
# adentro hacia afuera). api-gateway NO sale por acá — se revisó su código
# y no hace ningún llamado externo real (su EntraIdService solo decodifica
# el JWT localmente, no valida contra Azure — eso lo centraliza
# abac-microservice).
#
# Por eso va en un <VirtualHost>/Listen separado — mezclar ProxyRequests On
# (forward) con el vhost reverse-proxy de apache-staging.conf es un error
# común que puede convertir ese vhost en un proxy abierto para cualquiera
# que le pegue por internet.
#
# - api-snowq-service usa SN_PROXY_URL (.env.staging/.env.production) →
#   HttpsProxyAgent en src/servicenow/client/sn-proxy-agent.ts, aplicado al
#   HttpModule global (ServiceNowClientService) y a la llamada OAuth2
#   directa (servicenow-token.service.ts).
# - integration-service usa HTTPS_PROXY (env var estándar, la detectan solas
#   axios y @azure/identity) → wiring explícito solo para el Graph Client
#   de Outlook (fetch nativo, no detecta HTTPS_PROXY), ver
#   src/infrastructure/external/connectors/http-proxy-agent.ts.
#
# Requiere:
#   sudo a2enmod proxy proxy_connect
#   sudo systemctl reload apache2

Listen 8080

<VirtualHost *:8080>
    # Sin ServerName — este vhost no responde a un dominio público, solo
    # acepta conexiones desde la red interna donde viven api-snowq-service
    # e integration-service.

    ProxyRequests On
    ProxyVia On

    # CONNECT (túnel HTTPS) solo al puerto 443 — no dejar abrir túneles a
    # cualquier puerto arbitrario.
    AllowCONNECT 443

    <Proxy *>
        # Restringido a las IPs internas de api-snowq-service e
        # integration-service — NUNCA dejar esto abierto (Require all
        # granted convertiría esto en un proxy abierto de internet, uno de
        # los abusos más comunes de mod_proxy mal configurado).
        Require ip 127.0.0.1
        # Sumar acá las IPs reales si alguno corre en otra máquina.
    </Proxy>

    # mod_proxy no tiene un mecanismo simple para restringir el DESTINO de
    # un túnel CONNECT (el contenido es opaco, va cifrado TLS de punta a
    # punta) — la restricción por destino (solo la instancia real de
    # ServiceNow) tiene que hacerse a nivel de firewall/red, no acá.

    ErrorLog  ${APACHE_LOG_DIR}/forward-proxy-error.log
    CustomLog ${APACHE_LOG_DIR}/forward-proxy-access.log combined
</VirtualHost>
