# Apache vhost — staging.eventcorner.example
#
# Sirve, sobre el mismo dominio/certificado:
#   /                 -> event-corner-app,        vite preview (localhost:5175)  [raíz]
#   /snowq/*          -> api-snowq-dashboard,      vite preview (localhost:3091) [prefijo se preserva]
#   /observability/*  -> observability-dashboard,  vite preview (localhost:5174) [prefijo se preserva]
#   /auth/*           -> auth-configuration-app,   vite preview (localhost:5173) [prefijo se preserva]
#   /api/*            -> api-snowq-service (localhost:3090)                     [se STRIPEA el prefijo]
#   /abac-api/*       -> abac-microservice (localhost:3005)                     [se STRIPEA el prefijo]
#   /obs-api/*        -> observability-service (localhost:3099)                 [se STRIPEA el prefijo]
#   /gw-api/*         -> api-gateway (localhost:3000)                           [se STRIPEA el prefijo]
#
# Mismo patrón que workspace-working/dashboard/deploy/apache-staging.conf:
# Apache no sirve estático desde disco, reverse-proxea todo. Cada dashboard
# corre `vite preview` vía PM2 (ver <app>/ecosystem.config.cjs) y espera el
# mismo `base` con el que fue buildeado (fijo en cada vite.config.ts, no
# condicional a NODE_ENV).
#
# api-snowq-dashboard llama a su backend por ruta relativa (/api/*,
# VITE_API_BASE_URL=/api) — por eso /api necesita esta regla.
#
# auth-configuration-app en cambio usa una URL ABSOLUTA horneada en el build
# (VITE_ABAC_API_URL=https://<este-dominio>/abac-api) — necesita que abac
# esté expuesto en este mismo Apache bajo /abac-api para tener HTTPS real
# (abac no tiene TLS propio, solo escucha HTTP en :3005 internamente).
#
# observability-dashboard y event-corner-app usan la misma lógica que
# auth-configuration-app: VITE_OBS_URL / VITE_GATEWAY_URL son URLs absolutas
# que necesitan a observability-service / api-gateway expuestos acá (ninguno
# de los dos tiene TLS propio).
#
# Requiere estos modulos habilitados (alias es el que suele olvidarse —
# sin el, RedirectMatch tira "Invalid command" y Apache ni arranca):
#   sudo a2enmod proxy proxy_http ssl headers rewrite alias
#   sudo systemctl reload apache2
#
# Certificado SSL: reemplazar por las rutas reales (por ejemplo, certbot en
# /etc/letsencrypt/live/staging.eventcorner.example/...) antes de usar esto
# en un servidor real.
#
# Reemplazar tambien:
#   - ServerName / ServerAlias
#   - Los localhost:PUERTO si los dashboards no corren en esta misma maquina

<VirtualHost *:80>
    ServerName staging.eventcorner.example

    # Todo HTTP se redirige a HTTPS — nunca servir contenido real por 80.
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName staging.eventcorner.example

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/staging.eventcorner.example/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/staging.eventcorner.example/privkey.pem

    # ── Headers reenviados a los backends ───────────────────────────────────
    # Ninguno de los backends de este ecosistema exige X-Forwarded-Proto hoy
    # (a diferencia de api-middleware-service), pero mandarlo no rompe nada y
    # evita el problema si algo lo empieza a validar mas adelante.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # ── /snowq (SIN barra final) -> /snowq/ ─────────────────────────────────
    # ProxyPass "/snowq/" (abajo) exige la barra final para matchear — sin
    # esta linea, /snowq pelado cae a un 404 de Apache y nunca llega a la app
    # (mismo bug real que documenta workspace-working/dashboard para /dashboard).
    RedirectMatch ^/snowq$ /snowq/
    RedirectMatch ^/observability$ /observability/
    RedirectMatch ^/auth$ /auth/

    # ── /api/* -> api-snowq-service :3090 (se STRIPEA el prefijo) ───────────
    # /api/snow-requests  ==>  http://localhost:3090/snow-requests
    # Solo lo usa api-snowq-dashboard (VITE_API_BASE_URL=/api relativo).
    ProxyPass        /api http://localhost:3090
    ProxyPassReverse /api http://localhost:3090

    # ── /abac-api/* -> abac-microservice :3005 (se STRIPEA el prefijo) ──────
    # /abac-api/auth/admin/login  ==>  http://localhost:3005/auth/admin/login
    # Lo usa auth-configuration-app (VITE_ABAC_API_URL=https://.../abac-api,
    # URL absoluta) — sin esto abac no tiene forma de ser alcanzado por HTTPS.
    ProxyPass        /abac-api http://localhost:3005
    ProxyPassReverse /abac-api http://localhost:3005

    # ── /obs-api/* -> observability-service :3099 (se STRIPEA el prefijo) ───
    # /obs-api/ingest/logs  ==>  http://localhost:3099/ingest/logs
    # Lo usa observability-dashboard (VITE_OBS_URL=https://.../obs-api, URL
    # absoluta) — sin esto observability-service no tiene forma de ser
    # alcanzado por HTTPS. El resto de los servicios (monolith, gateway,
    # abac, snowq, integration) le siguen pegando directo por HTTP interno
    # (LOG_TRANSPORT_URL/OBS_METRICS_URL/OBS_TRACES_URL) — no pasan por acá.
    ProxyPass        /obs-api http://localhost:3099
    ProxyPassReverse /obs-api http://localhost:3099

    # ── /gw-api/* -> api-gateway :3000 (se STRIPEA el prefijo) ──────────────
    # /gw-api/incidents  ==>  http://localhost:3000/incidents
    # Lo usa event-corner-app (VITE_GATEWAY_URL=https://.../gw-api, URL
    # absoluta) — sin esto api-gateway no tiene forma de ser alcanzado por
    # HTTPS. monolith le sigue pegando directo por HTTP interno
    # (API_GATEWAY_URL=http://api-gateway:3000) para /outbound/servicenow/* —
    # no pasa por acá.
    ProxyPass        /gw-api http://localhost:3000
    ProxyPassReverse /gw-api http://localhost:3000

    # ── /snowq/* -> api-snowq-dashboard, vite preview :3091 ─────────────────
    # vite corre con base:'/snowq/', asi que espera el mismo path.
    ProxyPass        /snowq/ http://localhost:3091/snowq/
    ProxyPassReverse /snowq/ http://localhost:3091/snowq/

    # ── /observability/* -> observability-dashboard, vite preview :5174 ─────
    ProxyPass        /observability/ http://localhost:5174/observability/
    ProxyPassReverse /observability/ http://localhost:5174/observability/

    # ── /auth/* -> auth-configuration-app, vite preview :5173 ───────────────
    ProxyPass        /auth/ http://localhost:5173/auth/
    ProxyPassReverse /auth/ http://localhost:5173/auth/

    # ── / -> event-corner-app, vite preview :5175 (catch-all, va al final) ──
    # base:'/' (default de Vite) — es la app principal, vive en la raiz del
    # dominio. Tiene que ir despues de las reglas mas especificas de arriba.
    ProxyPass        / http://localhost:5175/
    ProxyPassReverse / http://localhost:5175/

    ErrorLog  ${APACHE_LOG_DIR}/staging-eventcorner-error.log
    CustomLog ${APACHE_LOG_DIR}/staging-eventcorner-access.log combined
</VirtualHost>
