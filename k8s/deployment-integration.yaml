apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-service
  namespace: event-corner
  labels:
    app: integration-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: integration-service
  template:
    metadata:
      labels:
        app: integration-service
    spec:
      containers:
        - name: integration-service
          image: event-corner/integration-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3008
          envFrom:
            - configMapRef:
                name: integration-config
            - secretRef:
                name: integration-secrets
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 3008
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 3008
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: integration-service
  namespace: event-corner
spec:
  selector:
    app: integration-service
  ports:
    - port: 3008
      targetPort: 3008
  type: ClusterIP
