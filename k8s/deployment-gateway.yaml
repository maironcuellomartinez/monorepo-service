apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: event-corner
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: event-corner/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# ClusterIP para tráfico interno entre servicios
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: event-corner
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
# LoadBalancer / NodePort para exponer solo el gateway hacia el exterior
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-public
  namespace: event-corner
  annotations:
    # En VPS con MetalLB o un cloud LB, este service recibe tráfico externo
    # y lo enruta al gateway. Todos los demás ClusterIP son internos.
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 3000
      name: http
    - port: 443
      targetPort: 3000
      name: https
  type: LoadBalancer
