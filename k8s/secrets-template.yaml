# integration-secrets:
#   ABAC_M2M_TOKEN, DB_USERNAME, DB_PASSWORD
#   DROPPOINT_USERNAME, DROPPOINT_PASSWORD (si aplica)
#
# monolith-secrets:
#   JWT_SECRET, ABAC_M2M_TOKEN, DB_USERNAME, DB_PASSWORD
#   SN_DEFAULT_COMPANY_SYS_ID, SN_DEFAULT_COMPANY_ID
